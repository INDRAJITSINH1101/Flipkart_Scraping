<!-- scraper/templates/scraper/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scraper Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-4xl mx-auto p-6 w-full">
        <h1 class="text-3xl font-bold text-center mb-8">📊 Scraping Dashboard</h1>
        
        {% if message %}
            <div class="mb-6 bg-green-100 border border-green-300 text-green-700 p-4 rounded">
                {{ message }}
            </div>
        {% endif %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 ">
            <form method="post" action="{% url 'run_scraper' %}">
                {% csrf_token %}
                <input type="hidden" name="scraper" value="flipkart">
                <button class="w-full bg-white shadow hover:shadow-lg p-6 rounded-lg text-left border">
                    <h2 class="text-xl font-semibold">📱 Flipkart Scraper</h2>
                    <p class="text-gray-600">Scrapes mobile data under ₹50,000 from Flipkart.</p>
                </button>
            </form>

            <form method="post" action="{% url 'run_scraper' %}">
                {% csrf_token %}
                <input type="hidden" name="scraper" value="linkedin">
                <button class="w-full bg-white shadow hover:shadow-lg p-6 rounded-lg text-left border">
                    <h2 class="text-xl font-semibold">💼 LinkedIn Scraper</h2>
                    <p class="text-gray-600">Scrapes job/profile data from LinkedIn.</p>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
